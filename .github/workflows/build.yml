name: Build

# Builds Malon Frequency Analyzer for Windows, macOS (universal arm64 + x86_64) and Linux,
# runs the unit tests and pluginval, and uploads the plugins as artifacts.
# Tags (v*) build the same zips as artifacts; no GitHub Release is created automatically.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VST3)
            os: windows-latest
            artifact: Malon-Frequency-Analyzer-Windows
          - name: macOS (VST3 + AU, universal)
            os: macos-15-intel
            artifact: Malon-Frequency-Analyzer-macOS
          - name: Linux (VST3, tests only)
            os: ubuntu-22.04
            artifact: Malon-Frequency-Analyzer-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libcurl4-openssl-dev libgl1-mesa-dev xvfb

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.8-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Check universal binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          for b in "build/MalonFrequencyAnalyzer_artefacts/${{ env.BUILD_TYPE }}/VST3/Malon Frequency Analyzer.vst3/Contents/MacOS/"* \
                   "build/MalonFrequencyAnalyzer_artefacts/${{ env.BUILD_TYPE }}/AU/Malon Frequency Analyzer.component/Contents/MacOS/"*; do
            lipo -archs "$b" | tee /dev/stderr | grep -q arm64 && lipo -archs "$b" | grep -q x86_64
          done

      - name: DSP + plugin tests (Linux uses a virtual display)
        if: runner.os == 'Linux'
        run: |
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} -R "dsp|meter" --output-on-failure
          xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build -C ${{ env.BUILD_TYPE }} -R plugin --output-on-failure

      - name: DSP tests (Windows, macOS)
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} -R "dsp|meter" --output-on-failure

      - name: Install pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Install pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval

      - name: Install pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip -d pluginval && chmod +x pluginval/pluginval

      - name: pluginval - VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 120000 "build/MalonFrequencyAnalyzer_artefacts/${{ env.BUILD_TYPE }}/VST3/Malon Frequency Analyzer.vst3"

      - name: pluginval - VST3 + AU (macOS)
        if: runner.os == 'macOS'
        run: |
          ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 120000 "build/MalonFrequencyAnalyzer_artefacts/${{ env.BUILD_TYPE }}/VST3/Malon Frequency Analyzer.vst3"
          # register the AU for this user, then validate it with Apple's auval and pluginval
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MalonFrequencyAnalyzer_artefacts/${{ env.BUILD_TYPE }}/AU/Malon Frequency Analyzer.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Mfaz Mlon
          ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 120000 "$HOME/Library/Audio/Plug-Ins/Components/Malon Frequency Analyzer.component"

      - name: pluginval - VST3 (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./pluginval/pluginval --strictness-level 10 --validate-in-process --timeout-ms 120000 "build/MalonFrequencyAnalyzer_artefacts/${{ env.BUILD_TYPE }}/VST3/Malon Frequency Analyzer.vst3"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          A="build/MalonFrequencyAnalyzer_artefacts/${{ env.BUILD_TYPE }}"
          cp LICENSE LICENSE-SEVEN-PHASES-MIT THIRD_PARTY_NOTICES.md docs/SOURCE.txt dist/
          cp -R "$A/VST3" dist/
          # linker leftovers (.exp / .lib) are not part of the plugin
          find dist -type f \( -name '*.exp' -o -name '*.lib' -o -name '*.pdb' -o -name '*.ilk' \) -delete
          if [ -d "$A/AU" ]; then cp -R "$A/AU" dist/; fi
          case "${{ runner.os }}" in
            Windows) cp docs/INSTALL-Windows.txt dist/INSTALL.txt ;;
            macOS)   cp docs/INSTALL-macOS.txt dist/INSTALL.txt
                     for b in dist/VST3/*.vst3/Contents/MacOS/* dist/AU/*.component/Contents/MacOS/*; do lipo -archs "$b" | tee -a dist/ARCHITECTURES.txt; done ;;
            *)       cp README.md dist/ ;;
          esac
          # sanity: notes present, no linker leftovers, version in SOURCE.txt matches the build
          test -f dist/SOURCE.txt && test -f dist/LICENSE
          if [ "${{ runner.os }}" != "Linux" ]; then test -f dist/INSTALL.txt; fi
          if find dist -type f \( -name '*.exp' -o -name '*.lib' -o -name '*.pdb' \) | grep -q .; then echo "linker leftovers in dist" >&2; exit 1; fi
          V=$(sed -n 's/^set(MALON_VERSION \(.*\))$/\1/p' CMakeLists.txt)
          grep -q "tag v$V" dist/SOURCE.txt || { echo "SOURCE.txt does not name tag v$V" >&2; exit 1; }
          if [[ "${{ github.ref }}" == refs/tags/v* ]] && [ "${{ github.ref_name }}" != "v$V" ]; then echo "tag ${{ github.ref_name }} != v$V" >&2; exit 1; fi
          cd dist && cmake -E tar cf "../${{ matrix.artifact }}.zip" --format=zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      # No automatic GitHub Release: tags only build the zips as workflow artifacts.
      # (Publishing a Release is a manual decision.)

  # NOTE: macOS builds are unsigned and un-notarised. Before a public release, add an Apple Developer ID
  # certificate as repository secrets and sign + notarise the .vst3 and .component (see docs/RELEASE.md).
